<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms. Lil Baker — Products</title><link rel="stylesheet" href="admin-products.css"></head><body><header><a href="admin.html">← Orders</a><strong>Ms. Lil Baker · Admin</strong><span>Products</span><button id="logout" type="button">Log out</button></header><main><div class="top"><div><p class="eyebrow">Menu manager</p><h1>Products</h1><p>Add, edit, hide or remove products without touching code.</p></div><button id="newBtn">+ Add product</button></div><div id="notice"></div><section class="panel"><div id="productList">Checking login…</div></section></main><div class="modal" id="modal"><div class="card"><button id="close">×</button><p class="eyebrow">Menu item</p><h2 id="formTitle">Add product</h2><form id="productForm"><input type="hidden" id="id"><label>Product name<input id="name" required></label><label>Category<select id="category" required></select></label><label>Price (₹)<input id="price" type="number" min="0" step="1" required></label><label>Description<textarea id="description"></textarea></label><label>Photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>Upload a photo directly. It is stored with the product, so it survives website rebuilds.</small></label><div id="photoPreview" class="photo-preview"></div><label>Or use an existing image URL<input id="image_url" type="url" placeholder="https://..."></label><label class="check"><input id="available" type="checkbox" checked> Available for ordering</label><label>Display order<input id="sort_order" type="number" min="0" value="0"></label><button class="save" type="submit">Save product</button></form></div></div><script src="config.js"></script><script src="photo-chocolate-hazelnut-cake.js"></script><script src="photo-berry-cheesecake.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-products.js"></script></body></html>
