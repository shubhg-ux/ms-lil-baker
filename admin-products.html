<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Ms. Lil Baker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin-products.css">
</head>
<body>
<header class="site-header"><div class="wrap"><a href="index.html" class="brand"><span class="brand-seal">MLB</span><span><span class="brand-name">Ms. Lil Baker</span><span class="brand-sub">Admin · Products</span></span></a></div></header>
<div class="wrap admin-shell" id="loginView">
  <div class="admin-narrow login-card">
    <span class="login-badge">Staff only</span><h1>Log in</h1><p class="sub">Manage the menu from here.</p>
    <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
    <div class="field"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn" type="button" style="width:100%;justify-content:center">Log in</button><div class="form-msg error" id="loginMsg"></div>
  </div>
</div>
<div class="wrap admin-shell hidden" id="adminView">
  <div class="admin-bar"><div class="admin-bar-title"><h1>The menu, managed</h1><p>Ms. Lil Baker · Admin</p></div><button class="btn btn-secondary btn-small" id="logoutBtn" type="button">Log out</button></div>
  <div class="stats-strip"><div class="stat-tile"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Total items</span></div><div class="stat-tile"><span class="stat-num" id="statLive">0</span><span class="stat-label">Live on site</span></div><div class="stat-tile"><span class="stat-num" id="statHidden">0</span><span class="stat-label">Hidden</span></div></div>
  <div class="admin-grid">
    <div class="panel panel-sticky"><h2 id="formTitle">Add a product</h2><div class="upload-preview" id="uploadPreview">Tap below to add a photo</div><div class="field"><div class="file-input-wrap"><span class="file-input-label" id="fileLabel">Choose photo</span><input type="file" id="photoInput" accept="image/*"></div></div><div class="field"><label for="nameInput">Name</label><input type="text" id="nameInput" placeholder="e.g. Belgian Chocolate Truffle Cake"></div><div class="field"><label for="categoryInput">Category</label><select id="categoryInput"><option>Cakes</option><option>Brownies</option><option>Cheesecakes</option><option>Cupcakes</option></select></div><div class="field"><label for="priceInput">Price (₹)</label><input type="number" id="priceInput" min="0" placeholder="e.g. 1200"></div><div class="field"><label for="descInput">Short description (optional)</label><textarea id="descInput" placeholder="e.g. Rich dark chocolate, salted caramel core"></textarea></div><button class="btn btn-primary" id="saveBtn" type="button" style="width:100%;justify-content:center">Save product</button><button class="btn btn-secondary btn-small hidden" id="cancelEditBtn" type="button" style="width:100%;justify-content:center;margin-top:8px">Cancel edit</button><div class="form-msg" id="saveMsg"></div></div>
    <div class="panel"><h2>Current menu</h2><div class="list-controls"><input type="text" id="searchInput" placeholder="Search by name…"><select id="filterSelect"><option value="All">All categories</option><option value="Cakes">Cakes</option><option value="Brownies">Brownies</option><option value="Cheesecakes">Cheesecakes</option><option value="Cupcakes">Cupcakes</option></select></div><div id="productList"><p class="small">Loading…</p></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin-products.js"></script>
</body></html>
