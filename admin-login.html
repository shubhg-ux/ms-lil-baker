<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ms. Lil Baker — Admin Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin-products.css">
</head>
<body>

<div class="admin-shell admin-narrow">
  <div class="login-card">
    <h1>Admin Sign In</h1>
    <p class="sub">Enter your credentials to manage products.</p>

    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@mslilbaker.com">
    </div>

    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword">
    </div>

    <button type="button" id="loginBtn" class="icon-btn" style="width: 100%; padding: 12px; margin-top: 8px;">Sign In</button>
    <div id="loginMsg" class="form-msg error" style="margin-top: 12px;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMsg");

    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      msg.style.color = "var(--berry-dark, #b8294f)";
      msg.textContent = "Connecting...";

      // Check if config exists
      if (!window.MSB_CONFIG || !window.MSB_CONFIG.url) {
        msg.textContent = "Error: MSB_CONFIG is missing or invalid in config.js";
        return;
      }

      // Check if Supabase SDK loaded
      if (!window.supabase) {
        msg.textContent = "Error: Supabase SDK failed to load from CDN.";
        return;
      }

      try {
        const supabaseClient = window.supabase.createClient(
          window.MSB_CONFIG.url, 
          window.MSB_CONFIG.anonKey
        );

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
          msg.textContent = "Please enter both email and password.";
          return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          msg.textContent = "Auth Error: " + error.message;
          return;
        }

        msg.style.color = "green";
        msg.textContent = "Success! Redirecting...";
        setTimeout(() => {
          window.location.href = "admin-products.html";
        }, 500);

      } catch (err) {
        msg.textContent = "Unexpected Error: " + err.message;
      }
    });
  });
</script>
</body>
</html>
