<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms. Lil Baker — Orders</title><link rel="stylesheet" href="style.css"><style>.admin{padding:45px clamp(16px,5vw,70px)}.admin-toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}.admin-toolbar h1{font-family:'Playfair Display',serif;font-size:3rem;margin:6px 0}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat-card{background:#fff;border:1px solid #f0dfe3;border-radius:18px;padding:18px}.stat-card span{font-size:.76rem;color:#806d73}.stat-card strong{display:block;font-family:'Playfair Display',serif;font-size:2.2rem;margin-top:4px}.admin-filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.admin-filters input,.admin-filters select{border:1px solid #ead8dc;background:#fff;border-radius:12px;padding:11px 13px}.table-wrap{overflow:auto;background:#fff;border:1px solid #f0dfe3;border-radius:18px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:15px;border-bottom:1px solid #f2e4e7;vertical-align:top}th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8b747a;background:#fff8f9}td{font-size:.86rem}.order-status{border:1px solid #ead8dc;border-radius:10px;padding:8px;background:#fff;font-weight:700}.order-status.status-accepted{background:#e8f6ec;color:#347a45}.order-status.status-preparing{background:#fff0d8;color:#93601c}.order-status.status-ready{background:#e6f1ff;color:#356aa3}.order-status.status-completed{background:#eee;color:#555}.order-status.status-rejected{background:#fde8e8;color:#a33}.quick-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.quick-actions button{border:1px solid #ead8dc;background:#fff;border-radius:8px;padding:6px 8px;font-size:.72rem}.quick-actions button:hover{background:#fff0f4}@media(max-width:800px){.admin-stats{grid-template-columns:repeat(2,1fr)}.admin-toolbar{align-items:flex-start;flex-direction:column}.admin-toolbar h1{font-size:2.3rem}}</style></head><body><header class="navbar"><a class="brand" href="index.html"><span>Ms. Lil Baker</span><small>Bakery control room</small></a><div class="admin-actions"><a class="button secondary" href="admin-products.html">Manage products</a><a class="button secondary" href="index.html">Customer site</a><button id="refresh" class="button secondary">Refresh</button><button id="logout" class="button secondary">Log out</button></div></header><main class="admin"><div class="admin-toolbar"><div><span class="eyebrow">Bakery control room</span><h1>Orders dashboard</h1><p id="adminStatus" class="small">Loading live orders…</p></div></div><div class="admin-stats"><div class="stat-card"><span>Pending confirmation</span><strong id="statNew">0</strong></div><div class="stat-card"><span>Accepted / preparing</span><strong id="statPreparing">0</strong></div><div class="stat-card"><span>Ready</span><strong id="statReady">0</strong></div><div class="stat-card"><span>Orders today</span><strong id="statToday">0</strong></div></div><div class="admin-filters"><input id="searchOrders" placeholder="Search order ID, customer or phone…"><select id="statusFilter"><option value="all">All statuses</option><option value="new">New</option><option value="accepted">Accepted</option><option value="preparing">Preparing</option><option value="ready">Ready</option><option value="completed">Completed</option><option value="rejected">Rejected</option></select><input id="dateFilter" type="date"><button id="clearFilters" class="button secondary">Clear</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Requested date</th><th>Customer</th><th>Contact</th><th>Items</th><th>Total</th><th>Status / action</th></tr></thead><tbody id="ordersBody"></tbody></table></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
