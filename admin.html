<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders Control Room — Ms. Lil Baker</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-products.css"><style>
.orders-shell{max-width:1500px;margin:auto;padding:36px clamp(14px,3vw,42px) 70px}.orders-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.orders-head h1{font:600 clamp(2.2rem,4vw,3.4rem) var(--serif);margin:5px 0}.orders-head p{color:var(--muted);margin:0}.admin-header-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.admin-stat{background:#fffdfb;border:1px solid var(--line);border-radius:17px;padding:16px 18px}.admin-stat span{display:block;font:700 9px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.admin-stat strong{display:block;margin-top:5px;font:600 28px var(--serif);color:var(--berry)}.admin-filters{display:flex;gap:9px;flex-wrap:wrap;padding:13px;background:#fffdfb;border:1px solid var(--line);border-radius:16px;margin-bottom:18px}.admin-filters input,.admin-filters select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;color:var(--ink);outline:0}.admin-filters input[type=text]{flex:1;min-width:220px}.status-board{display:grid;grid-template-columns:repeat(6,minmax(245px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}.status-column{background:#f8eee9;border:1px solid var(--line);border-radius:20px;min-height:260px;overflow:hidden}.column-head{padding:14px 14px 12px;background:#fffdfb;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}.column-head h2{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:0}.column-count{min-width:25px;height:25px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--rose);color:var(--berry);font:800 11px var(--sans)}.column-body{padding:10px;display:grid;gap:10px}.column-empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:11px;border:1px dashed var(--line);border-radius:13px;background:rgba(255,255,255,.35)}.order-card{background:#fffdfb;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 6px 18px rgba(59,38,32,.05);transition:transform .15s ease,box-shadow .15s ease}.order-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(59,38,32,.09)}.order-card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.order-card-top strong{display:block;color:var(--berry);font:800 11px var(--sans)}.order-card-top span{display:block;color:var(--muted);font-size:9px;margin-top:3px}.order-pill{white-space:nowrap!important;background:#f4e4dc;padding:5px 7px;border-radius:999px;text-transform:capitalize;font-weight:800!important;color:var(--ink)!important}.customer-name{font-weight:800;font-size:14px;margin:12px 0 6px}.order-meta{font-size:10px;line-height:1.6;color:var(--muted)}.order-items{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11px;line-height:1.6}.order-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}.order-bottom strong{font-size:13px;color:var(--ink)}.btn-wa-sm{display:inline-flex;align-items:center;background:#3f8d68;color:#fff;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:800;text-decoration:none}.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.btn-move,.btn-reject-order,.mini-status{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:10px;font-weight:800;cursor:pointer;color:var(--ink)}.btn-move{background:var(--berry);border-color:var(--berry);color:#fff}.btn-reject-order{color:#9b334f}.mini-status{grid-column:1/-1;width:100%}.status-rejected{opacity:.9}.status-rejected .order-pill{background:#f2dfe4;color:#9b334f!important}.status-completed .order-pill{background:#e1efe7;color:#347153!important}@media(max-width:1100px){.status-board{grid-template-columns:repeat(6,280px)}.admin-stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.orders-head{align-items:flex-start;flex-direction:column}.admin-stats{grid-template-columns:1fr 1fr}.status-board{grid-template-columns:repeat(6,275px)}.admin-filters{flex-direction:column}.admin-filters>*{width:100%}}@media(max-width:480px){.admin-stats{grid-template-columns:1fr 1fr}.admin-stat{padding:13px}.admin-stat strong{font-size:23px}}
</style></head><body><header class="site-header"><div class="wrap"><a class="brand" href="index.html"><span class="brand-seal">MLB</span><span><span class="brand-name">Ms. Lil Baker</span><span class="brand-sub">Orders Control Room</span></span></a><div class="admin-header-actions"><a class="btn btn-secondary" href="admin-dashboard.html">Dashboard</a><a class="btn btn-secondary" href="admin-content.html">Website</a><a class="btn btn-secondary" href="admin-products.html">Products</a><a class="btn btn-secondary" href="index.html">Live Site</a><button id="refresh" class="btn btn-secondary" type="button">Refresh</button><button id="logout" class="btn btn-primary" type="button">Log out</button></div></div></header><main class="orders-shell"><div class="orders-head"><div><div class="section-eyebrow">Live order flow</div><h1>Orders Control Room</h1><p id="adminStatus">Loading live orders…</p></div></div><div class="admin-stats"><div class="admin-stat"><span>Untouched</span><strong id="statNew">0</strong></div><div class="admin-stat"><span>In kitchen</span><strong id="statPreparing">0</strong></div><div class="admin-stat"><span>Ready</span><strong id="statReady">0</strong></div><div class="admin-stat"><span>Placed today</span><strong id="statToday">0</strong></div></div><div class="admin-filters"><input id="searchOrders" type="text" placeholder="Search order ID, customer name, or phone…"><select id="statusFilter"><option value="all">All statuses</option><option value="new">🔴 New</option><option value="accepted">🟡 Accepted</option><option value="preparing">🟠 Preparing</option><option value="ready">🟢 Ready</option><option value="completed">✅ Delivered / Completed</option><option value="rejected">❌ Rejected</option></select><input id="dateFilter" type="date"><button id="clearFilters" class="btn btn-secondary" type="button">Clear filters</button></div><section class="status-board" aria-label="Order status board"><section class="status-column"><div class="column-head"><h2>🔴 New orders</h2><span class="column-count" data-count="new">0</span></div><div class="column-body" data-column="new"></div></section><section class="status-column"><div class="column-head"><h2>🟡 Accepted</h2><span class="column-count" data-count="accepted">0</span></div><div class="column-body" data-column="accepted"></div></section><section class="status-column"><div class="column-head"><h2>🟠 Preparing</h2><span class="column-count" data-count="preparing">0</span></div><div class="column-body" data-column="preparing"></div></section><section class="status-column"><div class="column-head"><h2>🟢 Ready</h2><span class="column-count" data-count="ready">0</span></div><div class="column-body" data-column="ready"></div></section><section class="status-column"><div class="column-head"><h2>✅ Delivered / Completed</h2><span class="column-count" data-count="completed">0</span></div><div class="column-body" data-column="completed"></div></section><section class="status-column"><div class="column-head"><h2>❌ Rejected</h2><span class="column-count" data-count="rejected">0</span></div><div class="column-body" data-column="rejected"></div></section></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
