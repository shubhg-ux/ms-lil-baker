<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms. Lil Baker — Admin Sign In</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-products.css"></head><body><div class="admin-shell admin-narrow"><div class="login-card"><h1>Admin Sign In</h1><p class="sub">One login for the whole Ms. Lil Baker control centre.</p><div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" placeholder="you@mslilbaker.com" autocomplete="email"></div><div class="field"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div><button type="button" id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:8px">Sign In</button><div id="loginMsg" class="form-msg error" style="margin-top:12px"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMsg');btn.addEventListener('click',async()=>{msg.textContent='Connecting…';try{if(!window.MSB_CONFIG?.url||!window.supabase)throw new Error('Admin services are not available right now.');const sb=window.supabase.createClient(window.MSB_CONFIG.url,window.MSB_CONFIG.anonKey);const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password){msg.textContent='Please enter both email and password.';return}const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;msg.style.color='green';msg.textContent='Success! Opening your dashboard…';const params=new URLSearchParams(location.search);setTimeout(()=>{location.href=params.get('next')||'admin-dashboard.html'},300)}catch(e){msg.textContent=e.message||'Could not sign in.'}});});</script></body></html>
