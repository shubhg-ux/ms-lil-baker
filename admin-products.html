<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ms. Lil Baker — Manage Bakery Products</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <!-- FontAwesome Icons for Dashboard UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-seal">MLB</span>
      <span>
        <span class="brand-name">Ms. Lil Baker</span>
        <span class="brand-sub">Bakery Control Room</span>
      </span>
    </a>
    <div id="headerActions" class="admin-header-actions hidden">
      <a class="btn btn-secondary" href="admin.html"><i class="fa-solid fa-receipt"></i> Orders</a>
      <a class="btn btn-secondary" href="index.html" target="_blank"><i class="fa-solid fa-store"></i> Live Store</a>
      <button class="btn btn-primary" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
    </div>
  </div>
</header>

<!-- LOGIN VIEW -->
<div class="wrap admin-shell" id="loginView">
  <div class="admin-narrow login-card">
    <div class="login-header">
      <span class="brand-seal login-seal">MLB</span>
      <h1>Rubani's Control Room</h1>
      <p class="sub">Log in to manage your menu items, prices, and cake photos.</p>
    </div>
    
    <div class="field">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" placeholder="rubani@mslilbaker.com" autocomplete="username">
    </div>
    
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    
    <button class="btn btn-primary btn-full" id="loginBtn">
      <i class="fa-solid fa-lock"></i> Log in
    </button>
    
    <div class="form-msg error" id="loginMsg"></div>
  </div>
</div>

<!-- ADMIN VIEW (hidden until logged in) -->
<div class="wrap admin-shell hidden" id="adminView">
  <div class="admin-bar">
    <div>
      <span class="section-eyebrow">Catalog Manager</span>
      <h1>Manage Menu Products</h1>
    </div>
  </div>

  <div class="admin-grid">
    <!-- PRODUCT FORM PANEL -->
    <div class="panel form-panel">
      <h2 id="formTitle"><i class="fa-solid fa-plus"></i> Add a Baked Product</h2>
      
      <div class="photo-preview-wrap">
        <div class="upload-preview" id="uploadPreview">
          <i class="fa-regular fa-image placeholder-icon"></i>
          <span>No photo selected</span>
        </div>
      </div>

      <div class="field">
        <label for="photoInput">Product Photo</label>
        <div class="file-drop-zone">
          <input type="file" id="photoInput" accept="image/*">
        </div>
      </div>

      <div class="field">
        <label for="nameInput">Product Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Belgian Chocolate Truffle Cake">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="categoryInput">Category</label>
          <select id="categoryInput">
            <option>Cakes</option>
            <option>Brownies</option>
            <option>Cheesecakes</option>
            <option>Cupcakes</option>
            <option>Pastries</option>
            <option>Custom Bakes</option>
          </select>
        </div>

        <div class="field">
          <label for="priceInput">Price (₹)</label>
          <input type="number" id="priceInput" min="0" placeholder="e.g. 1200">
        </div>
      </div>

      <div class="field">
        <label for="descInput">Short Description (optional)</label>
        <textarea id="descInput" rows="3" placeholder="e.g. Rich 55% dark chocolate ganache, layered sponge, salted caramel drizzle."></textarea>
      </div>

      <button class="btn btn-primary btn-full" id="saveBtn">
        <i class="fa-solid fa-check"></i> Save Product
      </button>
      
      <button class="btn btn-ghost btn-full hidden" id="cancelEditBtn">
        Cancel Edit
      </button>

      <div class="form-msg" id="saveMsg"></div>
    </div>

    <!-- PRODUCT CATALOG LIST -->
    <div class="panel catalog-panel">
      <div class="catalog-header">
        <h2>Active Menu (<span id="productCount">0</span>)</h2>
        <input type="text" id="searchProducts" class="input-sm" placeholder="Search menu items…">
      </div>
      
      <div id="productList" class="product-admin-grid">
        <p class="loading-state">Loading product catalog…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin-products.js"></script>
</body>
</html>
