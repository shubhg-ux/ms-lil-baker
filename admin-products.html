<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ms. Lil Baker — Admin</title>
  <link rel="stylesheet" href="style.css"> <!-- Your main theme vars -->
  <link rel="stylesheet" href="admin-products.css">
</head>
<body>

<div class="admin-shell">

  <!-- Login Form View -->
  <div id="loginView" class="admin-narrow">
    <div class="login-card">
      <h1>Admin Sign In</h1>
      <p class="sub">Enter your credentials to manage products.</p>

      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@domain.com">
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword">
      </div>

      <button id="loginBtn" class="icon-btn" style="width: 100%; padding: 10px; margin-top: 8px;">Sign In</button>
      <div id="loginMsg" class="form-msg error"></div>
    </div>
  </div>

  <!-- Main Management View -->
  <div id="adminView" class="hidden">
    
    <div class="admin-bar">
      <h1>Ms. Lil Baker Admin</h1>
      <button id="logoutBtn" class="icon-btn">Log Out</button>
    </div>

    <div class="admin-grid">
      
      <!-- Product Form Panel -->
      <div class="panel">
        <h2 id="formTitle">Add a Product</h2>

        <div class="field">
          <label>Product Name</label>
          <input type="text" id="nameInput" placeholder="e.g. Chocolate Fudge Cake">
        </div>

        <div class="field">
          <label>Category</label>
          <select id="categoryInput">
            <option value="Cakes">Cakes</option>
            <option value="Brownies">Brownies</option>
            <option value="Cheesecakes">Cheesecakes</option>
            <option value="Cupcakes">Cupcakes</option>
          </select>
        </div>

        <div class="field">
          <label>Price (₹)</label>
          <input type="number" id="priceInput" placeholder="850">
        </div>

        <div class="field">
          <label>Description</label>
          <textarea id="descInput" placeholder="Flavors, size, ingredients..."></textarea>
        </div>

        <div class="field">
          <label>Photo</label>
          <div class="upload-preview" id="uploadPreview">No photo selected</div>
          <input type="file" id="photoInput" accept="image/*">
        </div>

        <button id="saveBtn" class="icon-btn" style="width: 100%; padding: 10px; margin-top: 12px;">Save Product</button>
        <button id="cancelEditBtn" class="icon-btn hidden" style="width: 100%; padding: 10px; margin-top: 6px;">Cancel</button>

        <div id="saveMsg" class="form-msg"></div>
      </div>

      <!-- Menu Items List -->
      <div class="panel">
        <h2>Current Menu</h2>
        <div id="productList">
          <p style="color:var(--ink-soft); font-size:13px;">Loading products...</p>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin-products.js"></script>
</body>
</html>
