<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Ms. Lil Baker · Orders</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-products.css"><style>.orders-shell{max-width:1400px;margin:0 auto;padding:38px clamp(14px,4vw,52px) 70px}.orders-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.orders-head h1{font:600 clamp(2.2rem,4vw,3.3rem) var(--serif);margin:4px 0}.orders-head p{color:var(--muted);margin:0}.admin-header-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.admin-stat{background:rgba(255,253,249,.9);border:1px solid var(--line);border-radius:17px;padding:17px 18px;box-shadow:0 8px 25px rgba(59,38,32,.04)}.admin-stat span{display:block;font:700 9px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.admin-stat strong{display:block;margin-top:5px;font:600 28px var(--serif);color:var(--berry)}.admin-filters{display:flex;gap:9px;flex-wrap:wrap;padding:13px;background:rgba(255,253,249,.8);border:1px solid var(--line);border-radius:16px;margin-bottom:16px}.admin-filters input,.admin-filters select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;color:var(--ink);outline:0}.admin-filters input:focus,.admin-filters select:focus{border-color:var(--berry)}.admin-filters input[type=text]{flex:1;min-width:220px}.table-wrap{overflow:auto;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 35px rgba(59,38,32,.06)}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{text-align:left;padding:15px;border-bottom:1px solid var(--line);vertical-align:top}th{font:700 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#fbf1ec}td{font-size:12px}.order-code{color:var(--berry);font:700 11px var(--sans)}.phone-cell{display:flex;flex-direction:column;gap:6px}.btn-wa-sm{display:inline-flex;align-items:center;gap:4px;background:#3f8d68;color:#fff;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700;text-decoration:none;width:max-content}.order-status{border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}.quick-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.btn-action{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:700;cursor:pointer;color:var(--ink)}.btn-action:hover{background:var(--rose);border-color:#d8b9ad}@media(max-width:800px){.orders-head{align-items:flex-start;flex-direction:column}.admin-stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.admin-stats{grid-template-columns:1fr}.admin-filters{flex-direction:column}.admin-filters>*{width:100%}}</style></head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="index.html"><span class="brand-seal">MLB</span><span><span class="brand-name">Ms. Lil Baker</span><span class="brand-sub">Orders Control Room</span></span></a><div class="admin-header-actions"><a class="btn btn-secondary" href="admin-content.html">Website</a><a class="btn btn-secondary" href="admin-products.html">Products</a><a class="btn btn-secondary" href="index.html">Live Site</a><button id="refresh" class="btn btn-secondary" type="button">Refresh</button><button id="logout" class="btn btn-primary" type="button">Log out</button></div></div></header>
<main class="orders-shell"><div class="orders-head"><div><div class="section-eyebrow">Control Room</div><h1>Orders Dashboard</h1><p id="adminStatus">Loading live orders…</p></div></div><div class="admin-stats"><div class="admin-stat"><span>New orders</span><strong id="statNew">0</strong></div><div class="admin-stat"><span>In kitchen</span><strong id="statPreparing">0</strong></div><div class="admin-stat"><span>Ready to ship</span><strong id="statReady">0</strong></div><div class="admin-stat"><span>Placed today</span><strong id="statToday">0</strong></div></div><div class="admin-filters"><input id="searchOrders" type="text" placeholder="Search order ID, customer name, or phone number…"><select id="statusFilter"><option value="all">All Order Statuses</option><option value="new">🔴 New</option><option value="accepted">🟡 Accepted</option><option value="preparing">🟠 Preparing</option><option value="ready">🟢 Ready</option><option value="completed">✅ Completed</option><option value="rejected">❌ Rejected</option></select><input id="dateFilter" type="date"><button id="clearFilters" class="btn btn-secondary" type="button">Clear Filters</button></div><div class="table-wrap"><table><thead><tr><th>Order ID / Time</th><th>Requested Date</th><th>Customer Info</th><th>Contact &amp; WhatsApp</th><th>Items Ordered</th><th>Total</th><th>Status / Quick Actions</th></tr></thead><tbody id="ordersBody"><tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">Loading live bakery orders…</td></tr></tbody></table></div></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script>
</body></html>
